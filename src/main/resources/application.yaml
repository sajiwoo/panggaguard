server:
  port: 8080
spring:
  application:
    name: panggaguard
  webflux:
    problemdetails:
      enabled: true
  reactor:
    context-propagation: auto
  security:
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-id: ${client-id}
            client-secret: ${client-secret}
            scope: openid, email, profile
  datasource:
    url: ${datasource-url}
    username: ${datasource-username}
    password: ${datasource-password}
add-config:
  token:
    jwt:
      expiry-time-h: ${jwt-expiry-time-h}
      secret: ${jwt-secret}
  application:
    domain: ${application-domain}
  authenticated:
    user:
      url-redirection: ${authenticated-user-url-redirection}
  cors:
    enabled: true
    allow-origins: "http://localhost:3000"
